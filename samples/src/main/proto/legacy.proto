// proto2, no java_multiple_files (everything nested in the outer class),
// closed enums, optional presence, a dependency on another file and on a well-known type.
syntax = "proto2";

package legacy;

import "sample.proto";
import "google/protobuf/timestamp.proto";

option java_package = "sample.legacy";

message Event {
  enum Level {
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
  }
  optional string source = 1;
  optional Level level = 2;
  repeated Level seen = 3;
  optional int32 count = 4;
  optional sample.Person who = 5;
  optional google.protobuf.Timestamp at = 6;
  repeated int64 ids = 7 [packed = true];
  repeated int64 unpacked_ids = 8;
  optional bytes payload = 9;
  optional bool flag = 10;
}

message Batch {
  repeated Event events = 1;
  optional string name = 2;
}
