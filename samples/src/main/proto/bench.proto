// Shapes used by the JMH benchmarks: a typical "API response" message tree.
syntax = "proto3";

package bench;

option java_package = "bench";
option java_multiple_files = true;

message Money {
  string currency = 1;
  int64 units = 2;
  int32 nanos = 3;
}

message LineItem {
  string sku = 1;
  string title = 2;
  int32 quantity = 3;
  Money price = 4;
  repeated string labels = 5;
  bool gift = 6;
  double weight = 7;
}

message Order {
  string id = 1;
  int64 created_at = 2;
  string customer = 3;
  repeated LineItem items = 4;
  Money total = 5;
  repeated int32 coupon_ids = 6;
  string note = 7;
  bytes signature = 8;
  optional string referrer = 9;
  uint32 status = 10;
}
