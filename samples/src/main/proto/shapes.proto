// proto3 oneofs and maps, java_multiple_files.
syntax = "proto3";

package shapes;

import "google/protobuf/timestamp.proto";

option java_package = "shapes";
option java_multiple_files = true;

enum Unit {
  UNIT_UNSPECIFIED = 0;
  MM = 1;
  INCH = 2;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

message Shape {
  string name = 1;
  oneof kind {
    double radius = 2;
    Point corner = 3;
    string label = 4;
    Unit unit = 5;
    bytes blob = 6;
    int64 serial = 7;
    bool flag = 8;
    google.protobuf.Timestamp at = 9;
  }
  map<string, int32> counts = 10;
  map<int32, string> names = 11;
  map<string, Point> points = 12;
  map<int64, Unit> units = 13;
  map<bool, bytes> blobs = 14;
  map<uint32, double> weights = 15;
  map<string, google.protobuf.Timestamp> times = 16;
  // declared after the maps but numbered before some of them
  optional int32 tail = 9999;
  oneof second {
    float ratio = 20;
    sint32 delta = 21;
  }
  int32 early = 17;
}
